<!DOCTYPE html>
<html lang="en-GB">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Deal Ready Diagnostic | Add Then Multiply</title>
    <style>
        :root {
            --primary: #0A192F;
            --accent: #D4AF37; /* Gold */
            --text-main: #333333;
            --text-light: #666666;
            --bg-light: #F8F9FA;
            --white: #FFFFFF;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
        }

        body {
            background-color: var(--bg-light);
            color: var(--text-main);
            line-height: 1.6;
            display: flex;
            flex-direction: column;
            min-height: 100vh;
        }

        header {
            background-color: var(--primary);
            color: var(--white);
            padding: 1.5rem 0;
            border-bottom: 4px solid var(--accent);
        }

        .container {
            max-width: 800px;
            margin: 0 auto;
            padding: 0 1.5rem;
            width: 100%;
        }

        .header-content {
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .logo {
            font-size: 1.5rem;
            font-weight: 700;
            letter-spacing: 0.5px;
            text-decoration: none;
            color: var(--white);
        }

        .logo span {
            color: var(--accent);
        }

        main {
            flex: 1;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 3rem 0;
        }

        .card {
            background: var(--white);
            border-radius: 8px;
            padding: 4rem 2.5rem;
            box-shadow: 0 4px 6px rgba(0,0,0,0.05);
            text-align: center;
            max-width: 600px;
            width: 100%;
        }

        h1 {
            font-size: 2.5rem;
            color: var(--primary);
            margin-bottom: 1rem;
        }

        p {
            font-size: 1.1rem;
            color: var(--text-light);
            margin-bottom: 2rem;
        }

        .btn {
            display: inline-block;
            background-color: var(--accent);
            color: var(--primary);
            font-weight: 600;
            font-size: 1.1rem;
            padding: 1rem 2rem;
            border: none;
            border-radius: 4px;
            text-decoration: none;
            transition: background-color 0.2s ease;
        }

        .btn:hover {
            background-color: #C09D2E;
        }
    </style>
</head>
<body>

    <header>
        <div class="container header-content">
            <a href="index.html" class="logo">Add<span>Then</span>Multiply</a>
            <div style="font-weight: 500; opacity: 0.9;">Deal Ready Diagnostic</div>
        </div>
    </header>

    <main class="container">
        <div class="card">
            <h1>Coming Soon</h1>
            <p>The Add Then Multiply M&A Advisory diagnostic is currently in development. It will guide you through strategic logic, target identification, approach, and integration planning.</p>
            <a href="exit-ready.html" class="btn">Try the Exit Ready Diagnostic</a>
        </div>
    </main>

</body>
</html>
